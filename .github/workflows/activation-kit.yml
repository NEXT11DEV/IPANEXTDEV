name: Build activation framework
on:
  push:
    branches: [activation-kit-ios-20261105]
    paths: ['activation-kit/**', '.github/workflows/activation-kit.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 5
    defaults:
      run:
        working-directory: activation-kit
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned arm64 iOS framework
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ActivationKit-unsigned
          path: activation-kit/out/ActivationKit.framework
          retention-days: 1
          if-no-files-found: error
